<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 60">
    <g transform="translate(10, 5)">
        <!-- Folder tab -->
        <rect x="5" y="5" width="20" height="15" rx="3" fill="#2563eb" />
        <!-- Folder back -->
        <rect x="5" y="10" width="40" height="30" rx="3" fill="#2563eb" />
        <!-- Document -->
        <rect x="12" y="12" width="26" height="26" fill="#ffffff" />
        <line x1="16" y1="18" x2="34" y2="18" stroke="#cbd5e1" stroke-width="1.5" />
        <line x1="16" y1="24" x2="34" y2="24" stroke="#cbd5e1" stroke-width="1.5" />
        <line x1="16" y1="30" x2="26" y2="30" stroke="#cbd5e1" stroke-width="1.5" />
        <!-- Folder front -->
        <rect x="5" y="20" width="40" height="25" rx="3" fill="#60a5fa" />
        <!-- Collaboration badge -->
        <circle cx="40" cy="35" r="10" fill="#10b981" />
        <circle cx="40" cy="30" r="1.5" fill="#ffffff" />
        <circle cx="36" cy="38" r="1.5" fill="#ffffff" />
        <circle cx="44" cy="38" r="1.5" fill="#ffffff" />
        <line x1="40" y1="30" x2="36" y2="38" stroke="#ffffff" stroke-width="1.5" />
        <line x1="40" y1="30" x2="44" y2="38" stroke="#ffffff" stroke-width="1.5" />
    </g>
    <text x="70" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b" letter-spacing="-0.5">Library</text>
</svg>
